<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomo Chrono</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/tomato.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-dark">
    <main class="app">
      <div class="top-controls">
        <button class="btn btn--ghost" data-action="fullscreen">
          FULLSCREEN
        </button>
        <button class="btn btn--ghost" data-action="theme">
          LIGHT MODE
        </button>
      </div>
      <div class="screen screen--intro is-active" data-screen="intro">
        <h1 class="screen__title">POMO CHRONO</h1>
        <p class="screen__subtitle">Study smarter with this pomodoro timer !</p>
        <img
          class="tomato tomato--hero"
          src="assets/tomato.png"
          alt="Pixel tomato"
        />
        <button class="btn btn--primary" data-action="start">START</button>
      </div>

      <div class="screen screen--task" data-screen="task">
        <h1 class="screen__title">SET YOUR TASK</h1>
        <p class="screen__subtitle">
          Write down the task you want to achieve during this session.
        </p>
        <input
          class="task-input"
          type="text"
          maxlength="64"
          placeholder=""
          aria-label="Task"
        />
        <button class="btn btn--primary" data-action="set-timer">
          SET TIMER
        </button>
      </div>

      <div class="screen screen--focus" data-screen="focus">
        <h1 class="screen__title">LET'S GO !</h1>
        <p class="screen__subtitle task-text" data-slot="task">Your task</p>
        <div class="timer" data-slot="timer">25:00</div>
        <img
          class="tomato tomato--mini"
          src="assets/tomato.png"
          alt="Pixel tomato"
        />
        <div class="controls">
          <button class="btn btn--ghost" data-action="pause">PAUSE</button>
          <button class="btn btn--ghost" data-action="reset">RESET</button>
        </div>
      </div>

      <div class="screen screen--break" data-screen="break">
        <h1 class="screen__title">BREAK TIME&nbsp;!</h1>
        <p class="screen__subtitle task-text" data-slot="task">Your task</p>
        <div class="timer" data-slot="timer">05:00</div>
        <button class="btn btn--primary" data-action="start-break">
          START BREAK
        </button>
        <div class="controls">
          <button class="btn btn--ghost" data-action="skip-break">SKIP</button>
        </div>
      </div>
    </main>

    <audio id="click-sound" preload="auto">
      <source
        src="data:audio/wav;base64,UklGRjQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA="
        type="audio/wav"
      />
    </audio>

    <script src="app.js"></script>
  </body>
</html>
